name: Merge Checks

# The project's fast merge-gating CI: lint, type-check, unit tests, a drift
# check over the committed Payload artifacts, and the documentation
# validators — on every pull request and on pushes to the default branch.
# This is the CI the loop-engineering change loop's tail polls after a push
# (see .claude/skills/loop-engineering/SKILL.md). Keep REVIEW.md's
# do-not-report list in sync with exactly what these jobs enforce.
# The heavier e2e + deploy pipeline lives in check-and-deploy.yaml.

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on PR refs only: on the default branch every push is a
# distinct merged commit whose checks must run to completion, or back-to-back
# merges leave earlier commits with cancelled (never-completed) verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Typecheck
        # `tsc --noEmit` needs no prior `npm run build`: the app declares its own
        # PageProps/LayoutProps interfaces rather than relying on the route types
        # Next generates into .next/types, so a bare `npm ci` checkout — with no
        # .next/ and no next-env.d.ts — type-checks on its own.
        run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Unit Test Run
        run: npm run test:unit

  payload-artifacts:
    name: Payload Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Regenerate Payload Artifacts
        # Both files are generated from the resolved Payload config and
        # committed. Neither is rewritten at build time — the import map is
        # only regenerated by the dev server's HMR reload — so a stale
        # importMap.js ships to production and blanks the admin document edit
        # view. Generation needs no env file, no database, and no blob token.
        run: |
          npx payload generate:importmap
          npx payload generate:types
      - name: Check For Drift
        # Scoped to the two artifact paths so the failure names what drifted
        # and unrelated working-tree noise cannot fail the job.
        run: |
          git diff --exit-code -- 'app/(payload)/admin/importMap.js' payload/types.ts || {
            echo '::error::Committed Payload artifacts are stale. Run `npx payload generate:importmap` and `npx payload generate:types`, then commit the result.'
            exit 1
          }

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        # No `cache: npm`, because no install follows for it to speed up.
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Check Documentation
        # Invoked directly rather than through an npm script, and deliberately
        # with no `npm ci`: the runner and the validators it spawns import only
        # the Node standard library, so this job costs checkout plus Node setup
        # and little else. The runner separates a documentation finding (1)
        # from a gate that could not run at all (2) — an installed skill
        # renamed out from under it, or a missing docs/index.md — so the two
        # are annotated apart and the original code is re-raised.
        run: |
          node scripts/check-docs.mjs || {
            code=$?
            if [ "$code" -eq 2 ]; then
              echo '::error::The documentation gate could not run, so nothing under docs/ was checked. See the step log for the path it expected.'
            else
              echo '::error::Documentation checks reported findings under docs/. Run `node scripts/check-docs.mjs` locally and fix what it reports.'
            fi
            exit $code
          }
